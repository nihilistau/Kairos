[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-companion"
version = "0.8.19"   # keep in step with CHANGELOG.md — it read 0.1.0 through
                    # two releases (fixed 2026-08-25), then sat at 0.8.4 through
                    # 0.8.5 (fixed 2026-08-29): this comment is the tripwire
description = "A local-first AI companion framework: durable, auditable memory that never deletes, unprompted speech with reasons, a room UI — against any OpenAI-compatible endpoint on one consumer GPU."
readme = "README.md"
# WINDOWS-ONLY today, and honestly so (2026-08-29 audit): serve.py's process
# control is CREATE_NO_WINDOW/taskkill/powershell and crashes uncaught on
# POSIX. The harness itself is portable; the launcher is not, yet.
classifiers = ["Operating System :: Microsoft :: Windows"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nihilistau" }]
keywords = ["companion", "agent", "memory", "local-first", "llm", "openai-compatible", "lm-studio", "llama-cpp", "mcp"]

# The harness runs with ZERO third-party deps (stdlib HTTP server + urllib, hashing embedder,
# jsonl stores). Optional extras unlock the nicer paths.
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]          # the sp-daemon transport (only with [engine] kind = "sp")
server = ["flask>=3.0"]         # nicer gateway than the stdlib fallback
config = ["pyyaml>=6.0"]        # YAML config files
embeddings = ["sentence-transformers>=2.2"]  # real local embeddings
# the export ships harness/mcp_server/ and the inbound bridge; the dependency was
# declared in the source pyproject 2026-08-25 and this overlay missed it (2026-08-29)
mcp = ["fastmcp>=3.0", "mcp>=1.20"]
# THE TEN MODULES THAT NEED numpy, AND NOTHING SAID SO (2026-09-11). `harness/senses/`
# {capture,gguf,vision}, `harness/sidecar/`{archive,rerank,tools} and `harness/voice/`
# {dsp,ear,native,service} import numpy at module level, unguarded. It was declared
# nowhere. THIS IS THE SAME DEFECT AS THE `mcp` ROW ABOVE, found the same way and one
# audit later: the public CI installs the core, and had never once reached the gate suite
# — it died at the import census on eleven modules, ten of them wanting numpy. Behind that
# wall the offline sweep was 135 green / 4 skip / 9 RED, every red a missing optional
# dependency rather than a broken rule. The 2026-08-31 audit fixed the instance it found
# and did not ask the packaging what else it was not saying; `harness_tests/g_imports.py`
# now asks, every run, so the next one cannot hide.
media = ["numpy>=1.24"]         # her voice, her eye, and the sidecar archive
all = ["httpx>=0.27", "flask>=3.0", "pyyaml>=6.0", "sentence-transformers>=2.2",
       "fastmcp>=3.0", "mcp>=1.20",
       "numpy>=1.24"]

[project.scripts]
harness = "harness.cli.main:main"

[project.urls]
Homepage = "https://github.com/nihilistau/Kairos"
Source = "https://github.com/nihilistau/Kairos"

[tool.setuptools.packages.find]
include = ["harness*"]
