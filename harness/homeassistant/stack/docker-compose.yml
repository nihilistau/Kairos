# Home Assistant + ESPHome — containers, not an appliance VM.
#
# WHY NOT HOME ASSISTANT OS: the OS image is a whole virtual machine. It needs a hypervisor,
# a console to recover, and it fails in ways you cannot see from the host — which is exactly
# how the previous install was lost. Containers start with the machine, log where everything
# else logs, and are recreated from this file.
#
# WHAT THAT COSTS: no Supervisor, therefore no ADD-ONS. That matters exactly once — ESPHome
# is normally an add-on — so it runs here as its own container, which is the officially
# supported alternative and is the same software.
#
# ── WHERE THIS RUNS, AND WHY IT IS NOT DOCKER DESKTOP ────────────────────────────────
#
# This file must run under Docker Engine INSIDE A WSL2 DISTRO, not Docker Desktop. Measured
# on 2026-08-26, not assumed:
#
#   * Under Docker Desktop, `network_mode: host` means the host of the DOCKER VM. Home
#     Assistant came up and listened on 8123 inside that namespace, and Windows could not
#     reach it at all — let alone the LAN. Verified: listening inside, HTTP 000 outside.
#   * A WSL2 distro with `networkingMode=mirrored` holds the Windows host's own LAN address
#     (10.0.0.150/24 on eth0, pinging the router). A container on host networking there
#     is genuinely on the LAN.
#
# That difference is the whole ballgame, because every discovery protocol Home Assistant
# relies on is MULTICAST — mDNS for ESPHome and Chromecast, SSDP for Hue and Sonos — and
# multicast does not cross a bridge network or a NAT. Without it nothing is ever found and
# every device is added by hand, by IP, forever.
#
# Both halves are required: `networkingMode=mirrored` in %USERPROFILE%\.wslconfig AND
# `network_mode: host` below. Either alone leaves the LAN invisible.
#
#   wsl -d Ubuntu-24.04 -u root
#   cd /opt/homeassistant && docker compose up -d
#
# Home Assistant  http://localhost:8123      ESPHome  http://localhost:6052

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: true

    # ── SUPERVISOR HOSTNAMES, FOR A CONFIG RESTORED FROM AN APPLIANCE ────────────────
    # A backup taken from Home Assistant OS points its MQTT entry at `core-mosquitto` and
    # its Matter entry at `core-matter-server`. Those are Supervisor-internal names and
    # nothing here answers to them, so both integrations fail with a DNS error rather than
    # a connection one -- which sends you looking at the broker instead of at the name.
    #
    # Mapping them beats editing .storage/core.config_entries, which is how a migration
    # becomes a corruption. The replacements below run on host networking beside Home
    # Assistant, so loopback is where they are.
    #
    # AND IT HAS TO BE HERE RATHER THAN IN THE DISTRO'S /etc/hosts. `network_mode: host`
    # shares the network NAMESPACE, not the filesystem: the container keeps its own
    # /etc/hosts, so a host-side entry is invisible to it. That cost an hour once.
    extra_hosts:
      - "core-mosquitto:127.0.0.1"
      - "core-matter-server:127.0.0.1"

    environment:
      TZ: Australia/Sydney
    volumes:
      # A NAMED VOLUME, NOT A BIND MOUNT FROM A WINDOWS DRIVE. Home Assistant's recorder is
      # SQLite, and SQLite over the Windows filesystem bridge is both slow and a documented
      # corruption risk. This keeps the database on ext4 where it belongs. Use
      # `tools/hactl.py` to read or edit files inside it, and Home Assistant's own Backups
      # for anything that should leave the machine.
      - ha-config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:stable
    restart: unless-stopped
    # Same reason: ESPHome discovers and OTA-flashes nodes over mDNS.
    network_mode: host
    privileged: true
    environment:
      TZ: Australia/Sydney
      ESPHOME_DASHBOARD_USE_PING: "true"
    volumes:
      - esphome-config:/config

  # ── MATTER SERVER, replacing the add-on of the same name ────────────────────────────
  # Home Assistant does not speak Matter itself; it talks to a separate server over a
  # websocket, which on the appliance is an add-on. Here it is a container, and the
  # `core-matter-server` mapping above is what lets the restored config entry find it
  # without being edited.
  #
  # It needs host networking for its own reason rather than by copying the others: Matter
  # commissioning uses IPv6 multicast and mDNS to find devices on the local link.
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - matter-data:/data
    environment:
      TZ: Australia/Sydney

# ── AND ONE ADD-ON THAT IS DELIBERATELY NOT REPLACED ──────────────────────────────────
# MOSQUITTO. The appliance ran `core-mosquitto`; this machine already had a broker on
# 1883 before any of this existed, and standing a second one beside it would be two
# brokers fighting for one port -- the exact shape of a bug this tree has hit before.
# `core-mosquitto` therefore resolves to loopback and lands on the broker that is already
# there, which accepts the connection because it is configured `allow_anonymous true`.
#
# THAT IS WORTH KNOWING RATHER THAN RELYING ON: an anonymous broker on 0.0.0.0:1883 will
# take commands from anything on the LAN. It is fine on a network with one user on it and
# it is not fine anywhere else, so if this stack ever moves, the broker needs a password
# file and the Home Assistant entry needs the credentials it already has stored.

volumes:
  ha-config:
  esphome-config:
  matter-data:
