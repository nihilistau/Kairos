# ── CI FOR THE PUBLIC TREE (2026-08-31, external review: "no CI, a clone can rot") ────
# The offline suite is the only thing that can tell an adopter whether THEIR clone is sound
# on a machine that is not the operator's. It ran on one Windows box for months, which is
# how a launcher that crashes on POSIX and a `nul` path that only breaks on Windows both
# survived: green is a property of a machine until something else runs it.
#
# ON LINUX ON PURPOSE. The upstream stack is Windows + CUDA; this tree is neither, and the
# whole point of the split is that the public framework does not inherit that. If a gate
# needs Windows, it should say so and skip (exit 2), not pass by luck.
#
# NO ENGINE, NO GPU, NO KEYS. Every gate here is OFFLINE by the index's own lane column.
# The three that skip (`g_avatar_default`, `g_batch_cont_guard`, `g_voice0_parity`) skip
# because their subject is genuinely absent, and the runner treats exit 2 as a pass —
# which is the convention `harness_tests/_gate.py` exists to enforce.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    # ── A SIGNAL NUMBER IS NOT A BUG REPORT (2026-09-11) ──────────────────────────────
    # One job per run has been dying with `exit=-11` — SIGSEGV — in a gate that passes
    # alone, and the sweep can only report the signal. `PYTHONFAULTHANDLER=1` makes the
    # interpreter dump the Python stack at the moment of the fault, so the next red names
    # a file and a line instead of a number. Costs nothing when nothing crashes.
    #
    # It is set at JOB level rather than on the sweep step so it covers the named-five
    # step and the store rules too: the crash has moved between gates, and there is no
    # reason to assume it will stay inside the sweep.
    env:
      PYTHONFAULTHANDLER: "1"
    strategy:
      fail-fast: false
      matrix:
        # THE FLOOR AND A CURRENT ONE. 3.11 is what pyproject declares (and declares
        # truthfully since 2026-09-11 — it said 3.10 while serve.py imported tomllib,
        # which is 3.11+, so the launcher could not start on the floor it advertised).
        # 3.12 is what people actually have. Testing the floor is the point: it is the
        # version a claim can be wrong about without anybody noticing.
        python: ["3.11", "3.12"]
        # ── TWO INSTALLS, BECAUSE THERE ARE TWO CLAIMS (2026-09-11) ──────────────────
        # This job installed `.[http]` and then asserted that EVERY module imports —
        # a stronger claim than the packaging makes, so it could only ever be red, and
        # it was: from the day this workflow landed until 2026-09-11 the suite below it
        # never ran once. Ten modules under senses/, voice/ and sidecar/ import numpy,
        # which was declared nowhere.
        #
        #   bare  proves the README's promise — the CORE runs with zero third-party
        #         dependencies — and lets a declared-optional extra be absent
        #   all   proves everything else, and is the only place a module that imports an
        #         UNDECLARED package can be caught, because with nothing installed its
        #         absence looks the same as an optional one's
        #
        # Both, or the pair of claims is half-tested in whichever direction was cheaper.
        deps: [bare, all]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install (${{ matrix.deps }})
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "bare" ]; then
            pip install -e ".[http]"     # the core's own promise, nothing more
          else
            pip install -e ".[all]"      # every declared extra
          fi

      - name: every module imports (G-IMPORTS)
        # CHEAPEST REAL SIGNAL, AND IT RUNS FIRST. A syntax error or a bad import in one
        # file cannot fail a suite that never reaches it — and the sweep runs gates as
        # subprocesses, so an unimportable module shows up as one confusing red rather
        # than as itself.
        #
        # IT IS A GATE NOW, NOT A HEREDOC (2026-09-11). As twenty lines of inline Python
        # it was a rule nobody could run locally and nobody could see fail until a push —
        # and it failed on every push for ten days. `g_imports.py` is the same census with
        # the exemption the packaging actually declares, runnable with one command.
        run: python harness_tests/g_imports.py

      - name: the five named in AGENTS.md
        # NAMED SEPARATELY from the sweep so a failure says WHICH door, in the log, without
        # anybody having to read a 160-line summary.
        run: |
          set -e
          for g in g_claim g_durability g_memory_lifecycle g_docs_true g_real_her; do
            echo "── $g"
            python "harness_tests/$g.py"
          done

      - name: the whole offline suite
        # ── CONTENTION WAS RULED OUT, AND THE SPEED CAME BACK (2026-09-11) ──────────
        # This ran `-j 1` for one round as a deliberate experiment: one job per run was
        # dying with a different gate each time, twice with SIGSEGV, and parallelism was
        # the suspect. The echo it carried answered the other half — `cpu_count = 4` on a
        # hosted runner, so the earlier cap took `-j` from 6 to 4 and barely moved.
        #
        # SERIAL STILL SEGFAULTED (`g_pk2_sse_v2_offline`, exit=-11, 83 s, nothing else
        # running). No contention theory survives that, so the experiment is over and
        # `-j` goes back to the derived default rather than costing 2.2x forever for a
        # disproven cause. The negative is kept in the changelog, not in the workflow.
        #
        # WHAT THE EVIDENCE ACTUALLY POINTS AT: all four failures have been in a `bare`
        # job and none in `all`, across roughly ten `all` job-runs. The difference
        # between those jobs is only which packages are installed, so the suspect is a
        # fallback path taken when an optional extra is ABSENT — which is also why it
        # never reproduces on a developer box, where they never are. PYTHONFAULTHANDLER
        # at job level is there to turn the next one into a file and a line.
        run: python tools/sweep.py

      - name: the store rules
        # The two that generalise past this repo: no store writer renames with a bare
        # os.replace, and no broad handler under harness/ is unbound.
        run: python harness_tests/g_store_writes.py

  room:
    # THE COMMITTED BUNDLE IS THE SOURCE. `console/room/` is a Vite build checked in so the
    # stack needs no Node at runtime; G-ROOM-BUNDLE rebuilds `ui/` and compares the emitted
    # bytes. It skips (exit 2) without npm, which on a clean runner means it would silently
    # never run — so this job installs npm on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[http]"
      - run: cd ui && npm ci
      # G-ROOM-KIT renders the kit under node and skips (exit 2) without ui/node_modules,
      # so it lives here beside the bundle, not in the npm-less offline job.
      - run: python harness_tests/g_room_kit.py
      - run: python harness_tests/g_room_bundle.py
